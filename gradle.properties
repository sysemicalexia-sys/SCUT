android.useAndroidX=true
kotlin.code.style=official

# Conservative on purpose: this is meant to build on-device (AIDE, on a
# phone), not a desktop with 16+ GB free. A smaller heap that doesn't OOM
# mid-build beats a larger one that does - see docs/engine-notes.md for
# more on this, including what to try if a build still fails partway
# through with a resource/AAPT2-shaped error.
org.gradle.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.daemon=true

# Uncomment and point at a specific aapt2 binary from your installed Build
# Tools if resource compilation itself is the thing failing:
# android.aapt2FromMavenOverride=/path/to/build-tools/36.0.0/aapt2
